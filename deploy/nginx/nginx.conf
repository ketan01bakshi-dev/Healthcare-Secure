events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  upstream api_upstream {
    server api:8000;
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # Clinic API (phones + web UI call this host)
  server {
    listen 443 ssl;
    server_name api.aarogyaoneconnect.in _;

    ssl_certificate     /etc/nginx/certs/clinic.crt;
    ssl_certificate_key /etc/nginx/certs/clinic.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 12m;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location / {
      proxy_pass http://api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  # Browser clinic desk (receptionist / staff / doctor)
  server {
    listen 443 ssl;
    server_name app.aarogyaoneconnect.in;

    ssl_certificate     /etc/nginx/certs/clinic.crt;
    ssl_certificate_key /etc/nginx/certs/clinic.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Next static export uses trailingSlash folders (…/today/index.html)
    location / {
      try_files $uri $uri/ $uri/index.html /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
      expires 7d;
      add_header Cache-Control "public";
      try_files $uri =404;
    }
  }

  # Public product / marketing site (Upwork Project URL, search, sharing)
  server {
    listen 443 ssl;
    server_name www.aarogyaoneconnect.in;

    ssl_certificate     /etc/nginx/certs/clinic.crt;
    ssl_certificate_key /etc/nginx/certs/clinic.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/www;
    index index.html;

    location / {
      try_files $uri $uri/ =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|xml|txt)$ {
      expires 7d;
      add_header Cache-Control "public";
      try_files $uri =404;
    }
  }
}
