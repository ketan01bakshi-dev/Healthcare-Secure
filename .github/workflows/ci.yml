name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install -U pip
          # Install backend requirements; skip faster-whisper (lazy import, heavy native stack).
          grep -vE '^[[:space:]]*faster-whisper' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
      - name: Pytest
        env:
          WHISPER_PRELOAD: "false"
        run: python -m pytest -q
