name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: |
          python -m pip install -U pip
          grep -vE '^[[:space:]]*faster-whisper' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
      - name: Pytest
        env:
          WHISPER_PRELOAD: "false"
        run: python -m pytest -q

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build static export
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
        run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder env files for compose config
        run: |
          # Real secrets stay on the VPS; Compose only needs the files to exist for `config`.
          touch backend/.env backend/.env.staging
      - name: Validate production compose
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate staging compose
        run: docker compose -p healthcare-secure-staging -f docker-compose.staging.yml config --quiet
      - name: Validate image overlay compose
        run: |
          export API_IMAGE=ghcr.io/example/healthcare-api:test
          docker compose -f docker-compose.yml -f docker-compose.image.yml config --quiet

  gating:
    if: always()
    needs: [backend-tests, frontend-quality, compose-config]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs
        run: |
          echo "backend-tests=${{ needs.backend-tests.result }}"
          echo "frontend-quality=${{ needs.frontend-quality.result }}"
          echo "compose-config=${{ needs.compose-config.result }}"
          test "${{ needs.backend-tests.result }}" = "success"
          test "${{ needs.frontend-quality.result }}" = "success"
          test "${{ needs.compose-config.result }}" = "success"
